<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <!-- Titre, description et canonical sont definis PAR PAGE via le hook
             useSeo (src/hooks/useSeo.js). Les valeurs ci-dessous ne sont que
             des valeurs par defaut, remplacees des le rendu de chaque route. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="SilkRoute" />
        <meta property="og:title" content="SilkRoute — Achats groupés Chine-Afrique" />
        <meta property="og:description" content="Importez depuis la Chine au prix de gros, sans voyager : achats groupés, fournisseurs vérifiés, transitaires licenciés, retrait dans votre ville." />
        <meta property="og:url" content="https://www.silkroute.africa/" />
        <meta name="twitter:card" content="summary" />
        <script>
            /* Applique le theme choisi avant le rendu React pour eviter un flash */
            try {
                if (localStorage.getItem('silkroute_theme') === 'light') {
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        </script>
        <meta name="description" content="SilkRoute - Importez depuis la Chine. Ensemble." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>SilkRoute | Groupage d'achats Chine-Afrique</title>
        <meta name="description" content="Importez depuis la Chine au prix de gros, sans voyager : achats groupés, fournisseurs vérifiés, transitaires licenciés, retrait dans votre ville." />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
